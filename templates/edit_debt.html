{% extends "base.html" %}

{% block title %}Edit debt — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit debt</h1>
            <p class="auth-subtitle">Update the details</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_debt', debt_id=debt_id) }}">
                {% include "_debt_fields.html" %}
                <button type="submit" class="btn-submit">Save changes</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('debts') }}">Back to planner</a>
        </p>

    </div>
</section>

{% endblock %}
