{% extends "base.html" %}

{% block title %}Add debt — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add debt</h1>
            <p class="auth-subtitle">Record what you owe</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_debt') }}">
                {% include "_debt_fields.html" %}
                <button type="submit" class="btn-submit">Add debt</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('debts') }}">Back to planner</a>
        </p>

    </div>
</section>

{% endblock %}
